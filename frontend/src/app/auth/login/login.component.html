<section
  class="mx-auto grid min-h-screen max-w-7xl items-center gap-12 px-5 py-12 lg:grid-cols-[1fr_420px] lg:px-8"
>
  <div class="max-w-2xl">
    <p class="mb-5 text-xs font-black uppercase tracking-[0.28em] text-lime-600">Welcome back</p>
    <h1
      class="max-w-xl text-5xl font-black leading-[0.98] tracking-[-0.04em] text-slate-950 sm:text-7xl"
    >
      Your hub for getting things done.
    </h1>
    <p class="mt-7 max-w-lg text-lg leading-8 text-slate-500">
      Sign in to continue to your workspace and keep your HTL projects moving.
    </p>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-7 shadow-xl shadow-slate-900/5 sm:p-9">
    <h2 class="text-2xl font-black text-slate-950">Sign in</h2>
    <p class="mt-2 text-sm text-slate-500">Use your HTL Hub account.</p>
    <form class="mt-8 space-y-5" (ngSubmit)="submit()">
      <label class="block text-sm font-bold text-slate-700"
        >Email
        <input
          [(ngModel)]="email"
          name="email"
          type="email"
          required
          placeholder="you@example.com"
          class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-lime-500 focus:ring-4 focus:ring-lime-100"
        />
      </label>
      <label class="block text-sm font-bold text-slate-700"
        >Password
        <input
          [(ngModel)]="password"
          name="password"
          type="password"
          required
          placeholder="••••••••"
          class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-lime-500 focus:ring-4 focus:ring-lime-100"
        />
      </label>
      @if (error) {
        <p class="rounded-lg bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">{{ error }}</p>
      }
      <button
        type="submit"
        [disabled]="isSubmitting"
        class="w-full rounded-lg bg-slate-950 px-4 py-3.5 font-black text-white transition hover:bg-slate-800 disabled:opacity-60"
      >
        {{ isSubmitting ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
    <p class="mt-7 text-center text-sm text-slate-500">
      Noch kein Konto?
      <a
        routerLink="/register"
        class="font-black text-slate-950 underline decoration-lime-400 decoration-2 underline-offset-4"
        >Registrieren</a
      >
    </p>
  </div>
</section>
