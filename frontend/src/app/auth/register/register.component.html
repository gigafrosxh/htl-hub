<section
  class="mx-auto grid min-h-screen max-w-7xl items-center gap-12 px-5 py-12 lg:grid-cols-[1fr_420px] lg:px-8"
>
  <div>
    <p class="mb-5 text-xs font-black uppercase tracking-[0.28em] text-lime-600">
      Join the workspace
    </p>
    <h1
      class="max-w-xl text-5xl font-black leading-[0.98] tracking-[-0.04em] text-slate-950 sm:text-7xl"
    >
      Make room for better work.
    </h1>
    <p class="mt-7 max-w-lg text-lg leading-8 text-slate-500">
      Create your account and bring your projects, people and ideas into one calm workspace.
    </p>
  </div>
  <div class="rounded-2xl border border-slate-200 bg-white p-7 shadow-xl shadow-slate-900/5 sm:p-9">
    <h2 class="text-2xl font-black text-slate-950">Create account</h2>
    <p class="mt-2 text-sm text-slate-500">Start with the basics. You can update them later.</p>
    <form class="mt-8 space-y-5" (ngSubmit)="submit()">
      <label class="block text-sm font-bold text-slate-700"
        >Name<input
          [(ngModel)]="name"
          name="name"
          required
          class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-3"
      /></label>
      <label class="block text-sm font-bold text-slate-700"
        >Email<input
          [(ngModel)]="email"
          name="email"
          type="email"
          required
          class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-3"
      /></label>
      <label class="block text-sm font-bold text-slate-700"
        >Password<input
          [(ngModel)]="password"
          name="password"
          type="password"
          minlength="8"
          required
          class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-3"
      /></label>
      @if (message) {
        <p class="rounded-lg bg-lime-50 px-4 py-3 text-sm font-semibold text-lime-800">
          {{ message }}
        </p>
      }
      @if (error) {
        <p class="rounded-lg bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">{{ error }}</p>
      }
      <button
        [disabled]="isSubmitting"
        class="w-full rounded-lg bg-slate-950 px-4 py-3.5 font-black text-white disabled:opacity-50"
      >
        {{ isSubmitting ? 'Creating...' : 'Create account' }}
      </button>
    </form>
    <p class="mt-7 text-center text-sm text-slate-500">
      Schon registriert?
      <a routerLink="/login" class="font-black text-slate-950 underline decoration-lime-400"
        >Einloggen</a
      >
    </p>
  </div>
</section>
