<div class="min-h-screen bg-slate-50 text-slate-900">
  @if (navigationOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-slate-950/45 backdrop-blur-[2px] lg:hidden"
      aria-label="Navigation schließen"
      (click)="closeNavigation()"
    ></button>
  }

  <aside
    id="main-navigation"
    class="app-sidebar fixed inset-y-0 left-0 z-50 flex w-[17.5rem] flex-col border-r border-slate-200 bg-white"
    [class.app-sidebar--open]="navigationOpen()"
  >
    <div class="flex h-20 shrink-0 items-center justify-between border-b border-slate-100 px-5">
      <a
        routerLink="/dashboard"
        class="group flex items-center gap-3 no-underline"
        (click)="closeNavigation()"
      >
        <span
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-950 text-lg font-black text-lime-300 shadow-lg shadow-slate-950/10"
          >H</span
        >
        <span>
          <span class="block text-lg font-black tracking-tight text-slate-950">HTL Hub</span>
          <span class="block text-[10px] font-bold uppercase tracking-[0.24em] text-slate-400"
            >School workspace</span
          >
        </span>
      </a>
      <button
        type="button"
        class="touch-target rounded-lg text-2xl text-slate-500 lg:hidden"
        aria-label="Navigation schließen"
        (click)="closeNavigation()"
      >
        ×
      </button>
    </div>

    <nav class="min-h-0 flex-1 overflow-y-auto px-3 py-5" aria-label="Hauptnavigation">
      @for (group of navigationGroups; track group.label) {
        <section class="mb-6" [attr.aria-labelledby]="'nav-' + $index">
          <h2
            [id]="'nav-' + $index"
            class="mb-2 px-3 text-[10px] font-black uppercase tracking-[0.22em] text-slate-400"
          >
            {{ group.label }}
          </h2>
          <div class="space-y-1">
            @for (item of group.items; track item.path) {
              <a
                [routerLink]="item.path"
                routerLinkActive="active-navigation-item"
                #activeLink="routerLinkActive"
                [attr.aria-current]="activeLink.isActive ? 'page' : null"
                class="navigation-item group flex min-h-11 items-center gap-3 rounded-xl px-3 py-2 text-sm font-bold text-slate-600 no-underline transition"
                (click)="closeNavigation()"
              >
                <span
                  class="navigation-badge flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-slate-100 text-[9px] font-black tracking-wide text-slate-500 transition"
                  >{{ item.shortLabel }}</span
                >
                <span>{{ item.label }}</span>
              </a>
            }
          </div>
        </section>
      }
    </nav>

    <div class="shrink-0 border-t border-slate-100 p-3">
      <button
        type="button"
        class="flex min-h-11 w-full items-center gap-3 rounded-xl px-3 text-left text-sm font-bold text-slate-600 transition hover:bg-red-50 hover:text-red-700"
        (click)="logout()"
      >
        <span
          class="flex h-7 w-7 items-center justify-center rounded-lg bg-slate-100 text-xs"
          aria-hidden="true"
          >↪</span
        >
        Abmelden
      </button>
    </div>
  </aside>

  <div class="app-content min-h-screen">
    <header
      class="sticky top-0 z-30 flex h-20 items-center justify-between border-b border-slate-200/80 bg-white/90 px-4 backdrop-blur-xl sm:px-6 lg:px-8"
    >
      <div class="flex items-center gap-3">
        <button
          type="button"
          class="touch-target flex items-center justify-center rounded-xl border border-slate-200 bg-white text-xl text-slate-700 shadow-sm lg:hidden"
          aria-label="Navigation öffnen"
          aria-controls="main-navigation"
          [attr.aria-expanded]="navigationOpen()"
          (click)="toggleNavigation()"
        >
          ☰
        </button>
        <div>
          <p class="text-[10px] font-black uppercase tracking-[0.22em] text-lime-600">Workspace</p>
          <p class="text-sm font-black text-slate-950 sm:text-base">Dein HTL-Alltag. Ein Hub.</p>
        </div>
      </div>
      <a
        routerLink="/settings"
        class="flex min-h-11 items-center gap-3 rounded-xl px-2 text-sm font-bold text-slate-600 no-underline transition hover:bg-slate-100 sm:px-3"
      >
        <span class="hidden sm:inline">Einstellungen</span>
        <span
          class="flex h-9 w-9 items-center justify-center rounded-xl bg-slate-950 text-xs font-black text-lime-300"
          >HH</span
        >
      </a>
    </header>

    <main id="main-content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
